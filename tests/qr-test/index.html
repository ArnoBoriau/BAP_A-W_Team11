<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vote with your phone</title>
  </head>
  <body class="screen">
    <header class="question">
      <p class="step" id="step"></p>
      <h1 id="question"></h1>
    </header>

    <section class="sides">
      <div class="side side-a" id="side-a">
        <span class="letter">A</span>
        <span class="answer" id="answer-a"></span>
        <span class="count" id="count-a"></span>
      </div>
      <div class="side side-b" id="side-b">
        <span class="letter">B</span>
        <span class="answer" id="answer-b"></span>
        <span class="count" id="count-b"></span>
      </div>
    </section>

    <p class="status" id="status">Connecting…</p>
    <div class="timer"><div id="timer-bar"></div></div>

    <aside class="join" id="join">
      <canvas id="qr"></canvas>
      <p class="join-label">Scan to vote</p>
      <p class="join-url" id="join-url"></p>
    </aside>

    <script type="module" src="/src/screen.js"></script>
  </body>
</html>
